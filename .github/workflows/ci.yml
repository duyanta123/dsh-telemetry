name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check (independent telemetry)
        run: npm run check
      - name: Independent telemetry regression
        run: npm test
      - name: CLI smoke test
        shell: bash
        run: |
          node bin/telemetry.mjs --status --path test/fixtures/telemetry-data --json
          node bin/telemetry.mjs --summary --path test/fixtures/telemetry-data --format text
          node bin/telemetry.mjs --trace trace-001 --path test/fixtures/telemetry-data

  compat:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Install pnpm for DSH plugin manager
        run: npm install --global pnpm@10.28.1
      - name: DSH 0.1.5-rc.2 compatibility
        run: npm run test:compat
