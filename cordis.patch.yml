# dsh-local-telemetry — DSH bundle patch。
#
# 当某个 profile 在 dsh.profile.bundles 中列出本包时（dsh plugin add 即完成
# 此事），dsh 启动时把本补丁打入配置树：插入本包插件行，加载 package.json
# 的 main（plugin/index.js），将自带 skills/ 注册为技能根。
#
# 遥测是旁路能力：插件入口只注册技能根、订阅宿主 session 事件总线、按配置惰性
# 创建 sink，并在关闭时 flush；不注册任何会改变请求语义的人设或工具。
#
# 插件配置写在行的 config 下（插件入口读取 config.telemetry；不配置即用默认值）：
#
#   - id: dsh-local-telemetry
#     name: dsh-local-telemetry
#     config:
#       telemetry:
#         store: sqlite            # jsonl | sqlite（sqlite 需 Node >= 22.5）
#         path: ~/.dsh/telemetry
#         sample_rate: 1
#         capture_metadata: none   # 默认不采集内容
#         hash_names: false
#         retention_days: 7
#
- insert:
    - id: dsh-local-telemetry
      name: dsh-local-telemetry
